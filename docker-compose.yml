services:
  livekit-server:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --dev
    ports:
      - "7880:7880"
      - "7881:7881"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 5s
      timeout: 3s
      retries: 5

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    ports:
      - "8083:8000"
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-base
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/v1/models\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  tts:
    build: ./tts-service
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=voice_agent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  agent:
    build: ./backend
    env_file: .env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - OPENAI_STT_BASE_URL=http://whisper:8000/v1
      - OPENAI_TTS_BASE_URL=http://tts:8082/v1
      - KOKORO_TTS_URL=http://kokoro-tts:8880/v1
      - TTS_PROVIDER=edge-tts
    depends_on:
      livekit-server:
        condition: service_healthy
      whisper:
        condition: service_healthy
      tts:
        condition: service_healthy
      kokoro-tts:
        condition: service_healthy
      db:
        condition: service_healthy

  token-server:
    build: ./backend
    command: ["uvicorn", "token_server:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    env_file: .env
    depends_on:
      livekit-server:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - token-server

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8880/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
